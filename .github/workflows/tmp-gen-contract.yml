name: TMP Generate Contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Provision sidecar placeholders for tauri-build
        run: |
          mkdir -p src-tauri/sidecar src-tauri/resources dist
          touch dist/index.html
          for bin in clash-orbit-service clash-orbit-service-install clash-orbit-service-uninstall orbit-mihomo orbit-mihomo-alpha; do
            touch "src-tauri/sidecar/${bin}-x86_64-unknown-linux-gnu"
          done

      - name: Generate bindings
        run: pnpm gen:contract

      - uses: actions/upload-artifact@v4
        with:
          name: bindings
          path: src/services/bindings.ts
